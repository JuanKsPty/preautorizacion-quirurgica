server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # DNS interno de Docker. Hace falta porque el upstream de /api va en una
    # variable: sin resolver, nginx no puede resolverla en tiempo de peticion.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Sonda del HEALTHCHECK del contenedor. No toca la API a proposito: una
    # sonda de vida que depende de otro servicio convierte un hipo ajeno en un
    # bucle de reinicio propio.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Los assets llevan hash en el nombre: se pueden cachear para siempre.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA: cualquier ruta desconocida la resuelve React Router.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # SOLO para la demo local de docker-compose.prod.yml (:8080).
    # En Dokploy este bloque NUNCA se usa: son dos aplicaciones separadas y es
    # Traefik quien enruta /api directo al contenedor de la API.
    #
    # El upstream va en una VARIABLE a proposito. Con un nombre literal, nginx
    # lo resuelve al ARRANCAR y sale con "host not found in upstream" si el
    # servicio no existe — el contenedor entraria en bucle de reinicio y la
    # aplicacion no cargaria nunca. Con variable, se resuelve por peticion.
    location /api {
        set $api_upstream "http://api:8000";
        proxy_pass $api_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # Sin esto el streaming del agente (SSE) se queda en el buffer de nginx
        # y la pantalla parece congelada.
        gzip off;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
}
