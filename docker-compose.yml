# ---------------------------------------------------------------------------
#  DESARROLLO: todo en contenedores, con recarga en caliente.
#
#      docker compose up          (o: pnpm dev)
#
#      frontend  http://localhost:5173
#      API       http://localhost:8000/api/docs
#      Postgres  localhost:5432
#
#  Para la version de produccion (build estatico servido por nginx):
#      pnpm run docker:prod       -> docker-compose.prod.yml
# ---------------------------------------------------------------------------
name: preautorizacion-quirurgica

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-app}
    ports:
      # Publicado para poder usar psql, Alembic o los tests desde el host.
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      # postgres:18+ quiere UN solo mount en /var/lib/postgresql (el clasico
      # .../data de las versiones <=17 hace que el contenedor no arranque).
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-app}']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      # La raiz del repo, igual que la web: un solo contexto de build.
      context: .
      dockerfile: Dockerfile.api
      target: dev
    # Etiqueta propia: si dev y prod compartieran nombre de imagen, el build de
    # uno sobreescribiria el del otro y "up" reusaria la imagen equivocada.
    image: preautorizacion-quirurgica-api-dev
    restart: unless-stopped
    volumes:
      # El codigo se monta: al guardar un archivo, uvicorn recarga.
      # El entorno de Python vive en /opt/venv, fuera de este volumen.
      - ./api:/app
    environment:
      # Dentro de la red de compose la base se llama "db", no localhost.
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-app}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-opus-5}
      ANTHROPIC_EFFORT: ${ANTHROPIC_EFFORT:-medium}
      ANTHROPIC_MAX_TOKENS: ${ANTHROPIC_MAX_TOKENS:-8192}
      NOTION_TOKEN: ${NOTION_TOKEN:-}
      NOTION_DB_POLIZAS: ${NOTION_DB_POLIZAS:-}
      NOTION_DB_INFORMES: ${NOTION_DB_INFORMES:-}
      NOTION_DB_PROCEDIMIENTOS: ${NOTION_DB_PROCEDIMIENTOS:-}
      NOTION_DB_PREAUTORIZACIONES: ${NOTION_DB_PREAUTORIZACIONES:-}
      APP_ENV: ${APP_ENV:-dev}
      AUTO_CREATE_TABLES: ${AUTO_CREATE_TABLES:-true}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      # En macOS y Windows los eventos de archivo no siempre cruzan el volumen;
      # con esto la recarga automatica funciona igual.
      WATCHFILES_FORCE_POLLING: 'true'
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '8000:8000'

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      target: dev
    image: preautorizacion-quirurgica-web-dev
    restart: unless-stopped
    volumes:
      - ./web:/repo/web
      # Volumen propio para node_modules: el del host no sirve dentro del
      # contenedor y taparia el que instalo la imagen.
      - web-node-modules:/repo/web/node_modules
    environment:
      # El proxy /api del servidor de Vite apunta al contenedor de la API.
      VITE_PROXY_TARGET: http://api:8000
      # Vite necesita sondear el sistema de archivos para ver los cambios
      # a traves del volumen.
      VITE_USE_POLLING: 'true'
    depends_on:
      - api
    ports:
      - '5173:5173'

volumes:
  postgres-data:
  web-node-modules:
